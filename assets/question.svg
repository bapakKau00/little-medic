<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 150" width="110" height="150">
  <!-- Chunky question mark, styled like the "?" on the Room 3 mystery cards -->
  <defs>
    <path id="q-hook" d="M28 44 Q28 16 54 16 Q80 16 80 42 Q80 58 62 66 Q52 71 52 86 V92"
          fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle id="q-dot" cx="52" cy="124" r="11"/>
  </defs>

  <!-- Red drop shadow -->
  <g transform="translate(6 6)">
    <use href="#q-hook" stroke="#1a1033" stroke-width="30"/>
    <use href="#q-hook" stroke="#ff3b5c" stroke-width="20"/>
    <circle cx="52" cy="124" r="16" fill="#1a1033"/>
    <use href="#q-dot" fill="#ff3b5c"/>
  </g>

  <!-- Yellow question mark with dark outline -->
  <use href="#q-hook" stroke="#1a1033" stroke-width="30"/>
  <use href="#q-hook" stroke="#ffe14d" stroke-width="20"/>
  <circle cx="52" cy="124" r="16" fill="#1a1033"/>
  <use href="#q-dot" fill="#ffe14d"/>

  <!-- Shine -->
  <path d="M34 40 Q36 24 52 22" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <circle cx="48" cy="120" r="3.5" fill="#ffffff" opacity="0.7"/>
</svg>
